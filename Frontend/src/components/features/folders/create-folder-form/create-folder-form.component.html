<form (ngSubmit)="createFolder()">
  <div class="modal-header">
    <h5 class="modal-title" id="create-folder-title">
      Create folder
    </h5>

    <button
      type="button"
      class="btn-close"
      aria-label="Close"
      [disabled]="isSaving"
      (click)="hideFolder()">
    </button>
  </div>

  <div class="modal-body">
    <label for="folder-name" class="form-label">
      Folder name
    </label>

    <input
      [(ngModel)]="folderModel.name"
      name="folderName"
      type="text"
      class="form-control"
      id="folder-name"
      placeholder="Enter folder name"
      maxlength="100"
      required
      ngbAutofocus
      [disabled]="isSaving">

    <div class="folder-hint">
      Up to 100 characters.
    </div>
  </div>

  <div class="modal-footer">
    <button
      type="button"
      class="btn btn-outline-secondary"
      [disabled]="isSaving"
      (click)="hideFolder()">
      Cancel
    </button>

    <button
      type="submit"
      class="btn save-folder-button"
      [disabled]="isSaving || !folderModel.name?.trim()">
      {{ isSaving ? 'Saving…' : 'Create folder' }}
    </button>
  </div>
</form>
