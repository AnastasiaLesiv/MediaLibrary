<div class="folders-list">
  <button
    type="button"
    class="btn btn-secondary w-100"
    (click)="showFolderCreationForm(createFolderModal)">
    Create folder
  </button>

  <div class="folders-list-data">
    @for (item of foldersList; track item.id) {
      <button
        type="button"
        class="button-folder"
        routerLink="/folderView/{{item.id}}"
        routerLinkActive="active">
        {{ item.name }}
      </button>
    }
  </div>
</div>

<ng-template #createFolderModal let-modal>
  <app-create-folder-form
    (successfullCreate)="refreshFolderList(); modal.close()"
    (hideFolderForm)="modal.dismiss()">
  </app-create-folder-form>
</ng-template>
